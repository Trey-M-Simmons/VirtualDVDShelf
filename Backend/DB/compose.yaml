name: virtual-dvd-shelf

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: virtual_dvd_shelf
      POSTGRES_USER: virtual_dvd_shelf
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in Backend/DB/.env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U virtual_dvd_shelf -d virtual_dvd_shelf"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
